services:
  - type: web
    name: afterchat
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EXTRACTION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EVIDENCE_MODEL
        value: gpt-4o-mini
      - key: OPENAI_STORY_MODEL
        value: gpt-5-mini
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
